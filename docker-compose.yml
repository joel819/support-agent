services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # runs in demo mode without a .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - agent-data:/app/data   # orders, routing log and ChromaDB survive restarts
    restart: unless-stopped

volumes:
  agent-data:
