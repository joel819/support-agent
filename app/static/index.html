<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Kestrel Support Agent</title>
<style>
  :root {
    --paper: #fff4dc; --card: #fffdf7; --ink: #1c1b33; --muted: #6a6780;
    --orange: #ff6a3d; --mint: #36d6a0; --lemon: #ffd43b; --lilac: #c3b1ff; --sky: #8fd3ff;
    --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 15px/1.55 ui-rounded, "Trebuchet MS", system-ui, sans-serif;
         background-color: var(--paper); background-image: radial-gradient(var(--ink) 0.8px, transparent 0.8px);
         background-size: 22px 22px; background-blend-mode: soft-light; }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 28px 16px 40px; display: grid;
          grid-template-columns: 1fr 310px; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .logo { width: 46px; height: 46px; display: grid; place-items: center; font-size: 24px; background: var(--lemon);
          border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); transform: rotate(-6deg); }
  h1 { font: 800 30px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.5px; }
  h1 span { background: linear-gradient(transparent 58%, var(--mint) 58%); padding: 0 4px; }
  .badge { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 99px; background: var(--mint);
           border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .badge.demo { background: var(--lemon); }
  header > .meta { flex-basis: 100%; }
  .panel { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
  h2 { font: 800 13px/1 ui-rounded, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 12px; }
  .chat { display: flex; flex-direction: column; min-height: 72vh; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 4px 4px 14px; }
  .msg { max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--lilac); border: 2px solid var(--ink); font-weight: 600;
              padding: 9px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 3px 3px 0 var(--ink); }
  .msg.bot { background: #fff; border: 2px solid var(--ink); padding: 12px 14px; border-radius: 16px 16px 16px 4px;
             box-shadow: 3px 3px 0 var(--ink); }
  .route { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
           padding: 2px 9px; border-radius: 99px; border: 2px solid var(--ink); margin-right: 8px; }
  .route.policy_search { background: var(--mint); } .route.order_status { background: var(--sky); }
  .route.both { background: var(--lilac); } .route.none { background: var(--lemon); }
  .meta { font-size: 12px; color: var(--muted); }
  .answer { margin: 8px 0 4px; font-size: 16px; white-space: pre-wrap; }
  .tag { background: var(--lemon); border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 5px;
         font-size: 12px; font-weight: 800; }
  details { font-size: 13px; margin-top: 6px; }
  details summary { cursor: pointer; font-weight: 700; }
  details pre { white-space: pre-wrap; word-break: break-word; background: var(--paper); border: 2px solid var(--ink);
                padding: 8px; border-radius: 10px; font-size: 12px; max-height: 240px; overflow: auto; }
  form { display: flex; gap: 10px; border-top: 3px solid var(--ink); padding-top: 14px; }
  input { flex: 1; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 3px solid var(--ink);
          background: #fff; color: var(--ink); outline: none; }
  input:focus { box-shadow: 0 0 0 4px var(--lemon); }
  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; border: 2px solid var(--ink);
           background: var(--card); color: var(--ink); padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink);
           transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button.primary { background: var(--orange); color: #fff; padding: 10px 22px; font-size: 16px; }
  button:disabled { opacity: .5; }
  .examples { background: var(--sky); }
  .examples button { display: block; width: 100%; text-align: left; margin-bottom: 8px; font-size: 13px; background: var(--card); }
  .examples button:last-child { margin-bottom: 0; }
  .orders { display: flex; flex-wrap: wrap; gap: 8px; }
  .orders button { font-size: 12px; padding: 3px 8px; background: var(--lemon); }
  .stats div { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; }
  .stats .meta { color: var(--ink); font-weight: 600; }
  aside .panel + .panel { margin-top: 20px; }
  aside a { color: var(--ink); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🛟</div>
    <h1>Kestrel <span>support</span></h1>
    <span id="status" class="badge">loading…</span>
    <span class="meta">Every answer shows the route taken: policy search, order lookup, both, or none.</span>
  </header>

  <main class="panel chat">
    <div id="log" class="log"></div>
    <form id="form">
      <input id="q" placeholder="Ask about an order or our policies…" autocomplete="off" maxlength="2000" required>
      <button class="primary" id="send">Send</button>
    </form>
  </main>

  <aside>
    <div class="panel examples">
      <h2>Try</h2>
      <button>What is your return policy?</button>
      <button>Where is order 1019?</button>
      <button>Order 1010 arrived damaged, what can I do?</button>
      <button>My order 1014 is late, is it lost?</button>
      <button>Where is my order?</button>
      <button>What's the weather in Berlin?</button>
    </div>
    <div class="panel">
      <h2>Sample orders</h2>
      <div id="orders" class="orders"></div>
    </div>
    <div class="panel">
      <h2>Routing log</h2>
      <div id="stats" class="stats"></div>
      <p class="meta"><a href="/logs" target="_blank">/logs</a> · <a href="/docs" target="_blank">API docs</a></p>
    </div>
  </aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const history = [];
const LABEL = { policy_search: "policy search", order_status: "order lookup", both: "both", none: "no tool" };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail?.[0]?.msg || body.detail || `Request failed (${r.status})`);
  return body;
}

async function refreshStats() {
  const s = await api("/logs/stats");
  $("#stats").innerHTML = Object.entries(s.by_route).map(([k, v]) =>
    `<div><span class="route ${k}">${LABEL[k]}</span><b>${v}</b></div>`).join("") +
    `<div class="meta"><span>total ${s.total}</span><span>avg ${s.avg_latency_ms} ms</span></div>`;
}

function add(cls, html) {
  const d = document.createElement("div");
  d.className = `msg ${cls}`;
  d.innerHTML = html;
  $("#log").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

function render(r) {
  const answer = esc(r.answer).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([A-Z][^\]]{2,60})\]/g, '<span class="tag">[$1]</span>');
  const mode = { groq: "LLM", demo: "demo (rule-based)", fallback: "fallback: LLM failed" }[r.mode];
  const tools = r.tool_calls.length
    ? `<details><summary>${r.tool_calls.length} tool call(s): ${r.tool_calls.map((c) => esc(c.name)).join(", ")}</summary>
       <pre>${esc(JSON.stringify(r.tool_calls.map(({ name, arguments: a, ok, result }) => ({ name, arguments: a, ok, result })), null, 2))}</pre></details>`
    : "";
  return `<div><span class="route ${r.route}">${LABEL[r.route]}</span><span class="meta">${mode} · log #${r.log_id}</span></div>
          <div class="answer">${answer}</div>${tools}`;
}

async function send(text) {
  add("user", esc(text));
  const bot = add("bot", '<span class="meta">Thinking…</span>');
  $("#send").disabled = true;
  try {
    const r = await api("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-6) }),
    });
    bot.innerHTML = render(r);
    history.push({ role: "user", content: text }, { role: "assistant", content: r.answer });
    refreshStats();
  } catch (e) {
    bot.innerHTML = `<span class="meta">Error: ${esc(e.message)}</span>`;
  } finally {
    $("#send").disabled = false;
  }
}

$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("#q").value.trim();
  if (t) { $("#q").value = ""; send(t); }
});
document.querySelector(".examples").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("#orders").addEventListener("click", (e) => { const id = e.target.dataset?.id; if (id) send(`Where is order ${id}?`); });

(async () => {
  const h = await api("/health");
  $("#status").textContent = h.demo_mode ? "Demo mode · rule-based" : `Live · ${h.agent}`;
  $("#status").classList.toggle("demo", h.demo_mode);
  const orders = await api("/orders");
  $("#orders").innerHTML = orders.map((o) => `<button data-id="${o.order_id}" title="${o.status}">${o.order_id} · ${o.status.replace(/_/g, " ")}</button>`).join("");
  refreshStats();
  add("bot", '<div class="answer">Hi! I can check an order\'s status or answer questions about returns, shipping, refunds and more.</div>');
})();
</script>
</body>
</html>
